{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>DVDFlix</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
</head>
<body>

<nav>
  <h1><a href="{% url 'dvd-index' %}">DVDFlix</a></h1>
  <div>
    {% if user.is_authenticated %}
      <a href="{% url 'dvd-index' %}">My DVDs</a>
      <a href="{% url 'dvd-create' %}">Add DVD</a>

      <form action="{% url 'logout' %}" method="post" style="display:inline;">
        {% csrf_token %}
        <button type="submit"
          style="background:none; border:none; color:#e50914; font-weight:bold; cursor:pointer;">
          Logout
        </button>
      </form>

    {% else %}
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'signup' %}">Sign Up</a>
    {% endif %}
  </div>
</nav>

<main>
{% block content %}
{% endblock %}
</main>

</body>
</html>
